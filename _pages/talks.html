---
layout: minimal
title: "Talks"
permalink: /talks/
---

<ul class="entries">
  {% for talk in site.talks reversed %}
  <li>
    <span><a href="{{ talk.url }}">{{ talk.title }}</a><br><span class="meta">{{ talk.type }} · {{ talk.venue }}{% if talk.location %}, {{ talk.location }}{% endif %}</span></span>
    <span class="date">{{ talk.date | date: "%b %Y" }}</span>
  </li>
  {% endfor %}
</ul>
